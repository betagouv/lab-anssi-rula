services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NOM}
      POSTGRES_USER: ${DB_UTILISATEUR}
      POSTGRES_PASSWORD: ${DB_MOT_DE_PASSE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_UTILISATEUR} -d ${DB_NOM}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rula-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOTE: postgres
      DB_PORT: 5432
      DB_NOM: ${DB_NOM}
      DB_UTILISATEUR: ${DB_UTILISATEUR}
      DB_MOT_DE_PASSE: ${DB_MOT_DE_PASSE}
      ALBERT_URL: ${ALBERT_URL}
      ALBERT_CLE_API: ${ALBERT_CLE_API}
      ALBERT_MODELE: ${ALBERT_MODELE:-openweight-medium}
      FEATUREBASE_CLE_API: ${FEATUREBASE_CLE_API}
      FEATUREBASE_BOARD_NAME: ${FEATUREBASE_BOARD_NAME}
      FEATUREBASE_API_URL: ${FEATUREBASE_API_URL:-https://do.featurebase.app/v2}
      RULA_PORT: ${RULA_PORT:-3001}
      RULA_MAX_REQUETES_PAR_MINUTE: ${RULA_MAX_REQUETES_PAR_MINUTE:-100}
    ports:
      - "${RULA_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    networks:
      - rula-network

  frontend:
    build:
      context: ui
      dockerfile: Dockerfile
    volumes:
      - ./ui:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - rula-network

networks:
  rula-network:

volumes:
  postgres_data:
